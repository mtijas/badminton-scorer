services:
  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: badminton_scorer
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton_scorer"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      WEB_ORIGIN: http://localhost:5173
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
